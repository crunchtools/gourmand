name: Container
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.39.1
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/gourmand
      boot: command
      # Run the real entrypoint against a tiny fixture project: proves the
      # binary starts, its libraries load, and `check --full` completes
      # (exit 0) on a clean directory. A bare --help would not exercise the
      # analysis path consumers use.
      boot-command: bash tests/image/boot-gate.sh
      cascade: true
      downstream: python-sdlc
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      CRUNCHTOOLS_CI_APP_KEY: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
